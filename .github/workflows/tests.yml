name: Validate simulator
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  blender:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - name: Install Blender 4.5.3
        shell: bash
        run: |
          curl --fail --location --retry 3 --output /tmp/blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          echo "BLENDER_BIN=/tmp/blender-4.5.3-linux-x64/blender" >> "$GITHUB_ENV"
      - run: python scripts/validate_examples.py --output /tmp/dmd-validation
      - name: Render setup illustration
        run: '"$BLENDER_BIN" -b --factory-startup --python-exit-code 1 --python blender/render_setup_overview.py -- --render-request /tmp/dmd-validation/orthogonal/inputs/render_request.json --output /tmp/dmd-setup.png'
      - run: '"$BLENDER_BIN" -b --factory-startup -t 2 --python-exit-code 1 --python tests/blender_pixel_coordinates.py'
